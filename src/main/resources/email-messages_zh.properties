# 简体中文邮件文案。由 templates/email/ 下的 Thymeleaf 模板通过 #{...} 解析，
# 使用 MailService 从 model 的 `locale` 键推导出的 Locale。
# 请与 email-messages.properties 保持键同步。
#
# 带 {0} 参数的消息会经过 MessageFormat，其中的半角撇号必须写成两个（''），
# 没有参数的消息则不能重复。中文文案使用全角引号，不涉及此问题。

# ---- 框架 -------------------------------------------------------------------
email.brand=Hinata
email.masthead.alt=Hinata
# {0} 是该实例所属的组织。邮件由该组织发出；Hinata 只是其运行的软件，
# 这一点由下面的 poweredBy 说明。
email.footer.automated=这是一封来自 {0} 的自动邮件。
email.footer.automatedAdmin=这是一封来自 {0} 的自动邮件。如有疑问，请联系你的管理员。
email.footer.poweredBy=由 Hinata 提供支持 · 可自托管的项目与事项管理
email.cta.fallback=按钮无法使用？请把下面的链接复制到浏览器中打开：
# 刻意保持中立：收件人打开的是他们自己的跟踪系统，而不是我们的产品。
email.cta.open=打开事项
email.greeting={0}，你好：

