# Content moderation.
#
# These are the user-facing statement of reasons for a refusal. They deliberately
# name the policy category and say that the check was automated, and they point at
# a human — a refusal that explains nothing is both bad product and, for a hosting
# service under DSA Art. 17, not sufficient. They deliberately do NOT name the term
# that matched or the score: that would turn the filter into an oracle to iterate
# against. The precise evidence stays on the moderation record for the reviewer.
error.moderation.blocked=Your content was not saved because it does not meet our content policy. This was an automated check; contact an administrator to have it reviewed by a person.
error.moderation.blockedReason=Your content was not saved because {0}. This was an automated check; contact an administrator to have it reviewed by a person.
error.moderation.blockedFile=The file {0} was not uploaded because {1}. This was an automated check; contact an administrator to have it reviewed by a person.
error.moderation.unavailable=This content could not be checked right now, so it was not accepted. Please try again in a few minutes.
error.moderation.reportSelf=You cannot report your own content
error.moderation.reportDuplicate=You have already reported this
error.moderation.reportRateLimited=You have filed a lot of reports recently. Please wait before filing another.
error.moderation.blockSelf=You cannot block yourself
error.moderation.notFound=This report no longer exists
# The admin queue's only write. Refused rather than accepted-as-a-no-op, because
# "leave it open" and "I decided nothing" look identical in a queue and the moderator
# would have to guess which one happened.
error.moderation.decisionRequired=A decision has to close the item - confirm it or dismiss it

# The reason clauses substituted into the messages above. Phrased to complete the
# sentence "Your content was not saved because ...".
moderation.reason.sexual=it appears to contain sexual or pornographic material
moderation.reason.sexualMinors=it appears to contain sexual content involving minors
moderation.reason.violence=it appears to contain graphic violence
moderation.reason.violentThreat=it appears to contain a threat of violence against a person
moderation.reason.hate=it appears to contain hate speech or a slur
moderation.reason.harassment=it appears to contain harassment or abuse aimed at a person
moderation.reason.selfHarm=it appears to promote self-harm
moderation.reason.extremism=it appears to contain extremist material
moderation.reason.illegal=it appears to contain illegal material
moderation.reason.malware=the file appears to be malicious
moderation.reason.generic=it does not meet our content policy

