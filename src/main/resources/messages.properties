# Voice uploads bypass StorageService, so they carry their own signature-mismatch
# message. Distinct from error.voice.notAudio on purpose: "notAudio" means the user
# attached the wrong file, this means bytes that claim to be audio and are not -
# telling someone whose recorder just failed to pick an audio file sends them
# looking for a mistake they did not make.
error.voice.contentMismatch=This recording is not the audio format it claims to be

# Pixel budget. Separate from the *TooLarge keys above, which are about the size of
# the file: this one fires when a small file declares an enormous picture, which is
# the shape a decompression bomb has and is not something the uploader can fix by
# compressing harder.
error.avatar.imageTooLarge=This picture has too many pixels to process. Please use a smaller image.
error.logo.imageTooLarge=This picture has too many pixels to process. Please use a smaller image.
error.storage.imageTooLarge=This image has too many pixels to process
error.media.imageTooLarge=The linked image has too many pixels to process
