# Exports de tickets (PDF / DOCX / XLSX / XML). Tout ce que dit un document
# exporté sans être du contenu : noms de champ, titres de section, en-têtes de
# tableau et les valeurs d'énumération qui s'imprimeraient sinon en SHOWSTOPPER
# ou SUBTASK. Résolu selon la locale de la requête, pour qu'un document soit
# rédigé dans la langue de l'application qui l'a demandé.
#
# Le statut d'un ticket est délibérément absent : les statuts du flux de travail
# sont nommés projet par projet par les personnes qui les utilisent, donc un
