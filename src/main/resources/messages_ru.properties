# Экспорт задач (PDF / DOCX / XLSX / XML). Всё, что говорит экспортированный
# документ и что не является содержимым: названия полей, заголовки разделов,
# шапки таблиц и те значения перечислений, которые иначе напечатались бы как
# SHOWSTOPPER или SUBTASK. Выбираются по языку запроса, поэтому документ
# написан на том языке, на который настроено запросившее его приложение.
#
# Статуса задачи здесь намеренно нет: статусы рабочего процесса в каждом
# проекте называют те, кто с ними работает, — статус это содержимое, а не
# название поля.
