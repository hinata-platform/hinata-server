# Как читается умная ссылка {{doc:...}}, если документ не сохранил рядом с ней
# заголовок статьи. Сам идентификатор никогда не печатается: читателю он ничего
# не говорит, а искать заголовок означало бы, что экспорт отвечает на вопросы о
# статьях, которые читателю, возможно, видеть нельзя.
