# Textos de correo en español. Los resuelven las plantillas Thymeleaf de
# templates/email/ mediante #{...}, contra la Locale que MailService deriva de la
# clave `locale` del modelo. Mantén las claves sincronizadas con
# email-messages.properties.
#
# Los mensajes con argumentos del tipo {0} pasan por MessageFormat, así que ahí
# un apóstrofo literal DEBE ir duplicado (''); en los mensajes sin argumentos NO.

# ---- estructura -------------------------------------------------------------
email.brand=Hinata
email.masthead.alt=Hinata
# {0} es la organización a la que pertenece la instancia. El correo lo envía esa
# organización; Hinata es solo el software sobre el que funciona, y así lo dice
# poweredBy más abajo.
email.footer.automated=Este es un mensaje automático de {0}.
email.footer.automatedAdmin=Este es un mensaje automático de {0}. Si tienes dudas, contacta con tu administración.
email.footer.poweredBy=Con la tecnología de Hinata · Gestión de proyectos e incidencias autoalojada
email.cta.fallback=¿No funciona el botón? Copia este enlace en tu navegador:
# Neutral a propósito: quien lo recibe abre SU gestor, no nuestro producto.
email.cta.open=Abrir la incidencia
email.greeting=Hola {0}:

# ---- notificación genérica --------------------------------------------------
email.notification.eyebrow=Notificación
email.eyebrow.ISSUE_ASSIGNED=Asignada a ti
email.eyebrow.ISSUE_UPDATED=Incidencia actualizada
email.eyebrow.ISSUE_COMMENTED=Nuevo comentario
email.eyebrow.ISSUE_INGESTED=Nueva incidencia por correo
email.eyebrow.ISSUE_DUE_SOON=Vence pronto
email.eyebrow.MENTION=Te han mencionado
email.eyebrow.COMMENT_REPLY=Respuesta a tu comentario
email.eyebrow.SPRINT_STARTED=Sprint iniciado
email.eyebrow.SPRINT_COMPLETED=Sprint completado
email.eyebrow.DIGEST=Resumen
email.eyebrow.SECURITY_ALERT=Seguridad
email.eyebrow.SYSTEM=Notificación
email.eyebrow.TEAM_ADDED=Equipo
email.eyebrow.TEAM_ROLE_CHANGED=Equipo
email.eyebrow.TEAM_REMOVED=Equipo
email.eyebrow.PROJECT_ADDED=Proyecto
email.eyebrow.TIME_TIMER_AUTO_STOPPED=Control de tiempo
email.eyebrow.TIMESHEET_SUBMITTED=Hoja de horas
email.eyebrow.TIMESHEET_APPROVED=Hoja de horas
email.eyebrow.TIMESHEET_REJECTED=Hoja de horas
email.eyebrow.TIMESHEET_REOPENED=Hoja de horas
email.eyebrow.TIME_CORRECTION_REQUESTED=Registro de tiempo

# ---- registro: confirmar el correo ------------------------------------------
email.verify.eyebrow=Bienvenida
email.verify.headline=Confirma tu dirección de correo
email.verify.body=¡Te damos la bienvenida a {0}! Confirma tu dirección de correo para activar tu cuenta y empezar a organizar el trabajo con tu equipo.
email.verify.cta=Confirmar la dirección de correo
email.verify.expiry=Este enlace es válido durante {0} horas.
email.verify.ignore=Si no te has registrado, puedes ignorar este correo sin problema.

# ---- invitación -------------------------------------------------------------
email.invite.eyebrow=Invitación
email.invite.headline=Te han invitado a {0}
email.invite.body={0} te ha invitado a unirte al espacio de trabajo de {1}.
email.invite.note=Nota personal
email.invite.setup=Configura tu cuenta aquí abajo y elige una contraseña: te llevará alrededor de un minuto.
email.invite.cta=Configurar mi cuenta
email.invite.expiry=Esta invitación es válida durante {0} días.
email.invite.ignore=Si no esperabas este correo, puedes ignorarlo sin problema.

# ---- restablecer la contraseña ----------------------------------------------
email.reset.eyebrow=Seguridad
email.reset.headline=Restablece tu contraseña
email.reset.body=Has pedido restablecer tu contraseña de {0}. Elige una nueva con el botón de abajo.
email.reset.cta=Elegir una contraseña nueva
email.reset.expiry=Este enlace es válido durante {0} minutos y solo se puede usar una vez.
email.reset.ignore=Si no has sido tú, tu contraseña no cambia y no tienes que hacer nada.

# ---- cambio de correo -------------------------------------------------------
email.emailChange.eyebrow=Seguridad
email.emailChange.headline=Confirma tu nueva dirección de correo
email.emailChange.body=Has pedido cambiar la dirección de correo con la que inicias sesión. Confirma la nueva dirección para completar el cambio.
email.emailChange.newAddress=Nueva dirección
email.emailChange.cta=Confirmar la dirección de correo
email.emailChange.expiry=Este enlace es válido durante {0} horas. Hasta que la confirmes, tu dirección actual sigue activa.
email.emailChange.ignore=Si no has sido tú, puedes ignorar este mensaje.

# ---- solicitud de aprobación (para la administración) -----------------------
email.approval.eyebrow=Administración
email.approval.headline=Un nuevo registro espera aprobación
email.approval.body=Alguien se ha registrado y ha confirmado su dirección de correo. Necesita tu aprobación antes de poder iniciar sesión.
email.approval.cta=Revisar el registro
email.approval.note=Recibes este mensaje porque administras {0}.

# ---- exportación de datos (art. 15 del RGPD) --------------------------------
email.export.eyebrow=Tus datos
email.export.headline=Tu exportación de datos está lista
email.export.body=La exportación de datos que pediste conforme al art. 15 del RGPD ya se ha generado y está lista para descargar.
email.export.cta=Descargar mis datos (PDF)
email.export.expiry=Este enlace de descarga personal es válido durante {0} horas.
email.export.warning=No compartas el enlace: da acceso a tu exportación de datos completa.

# ---- ciclo de vida de la cuenta ---------------------------------------------
email.account.eyebrow=Tu cuenta
email.account.activated.headline=Tu cuenta se ha activado
email.account.activated.body=Un administrador ha activado tu cuenta de {0}. A partir de ahora puedes volver a iniciar sesión.
email.account.activated.cta=Iniciar sesión en {0}
email.account.deactivated.headline=Tu cuenta se ha desactivado
email.account.deactivated.body=Tu cuenta de {0} se ha desactivado, así que por ahora no puedes iniciar sesión. Tus datos se conservan y la cuenta se puede reactivar en cualquier momento.
email.account.deleted.headline=Tu cuenta se ha eliminado
email.account.deleted.body=Tu cuenta de {0} se ha eliminado de forma permanente y se han revocado todos los accesos. Esta acción no se puede deshacer.
email.account.mistake=Si crees que se trata de un error, contacta con tu administración.
email.account.roles.headline=Tus roles se han actualizado
email.account.roles.granted=Se te han concedido permisos de administrador en {0}. Ya tienes acceso al área de administración y a la gestión de usuarios.
email.account.roles.revoked=Se te han retirado los permisos de administrador en {0}. Sigues teniendo acceso como miembro habitual.
email.account.roles.current=Roles actuales

# ---- resumen semanal --------------------------------------------------------
email.weekly.eyebrow=Resumen semanal
email.weekly.headline=Tu semana de un vistazo
email.weekly.intro=Esto es lo que ha pasado durante la última semana y lo que viene a continuación.
email.weekly.behind=La semana que dejas atrás
email.weekly.completed=Completadas
email.weekly.created=Creadas
email.weekly.focus=Tiempo de concentración
email.weekly.sprint=Sprint activo
email.weekly.sprintDay=Día {0} de {1}
email.weekly.sprintIssues={0} de {1} incidencias completadas
email.weekly.contributors=Principales colaboradores
email.weekly.contributorDone=completadas
email.weekly.highlights=Lo más destacado que se ha completado
email.weekly.ahead=Tu próxima semana
email.weekly.overdue={0} vencidas
email.weekly.empty=No tienes nada pendiente: estás al día.
email.weekly.more={0} más en la aplicación
email.weekly.cta=Abrir el resumen completo
email.weekly.footer=Este resumen se envía cada semana. Puedes desactivarlo en tus preferencias de notificación.

# ---- cambios agrupados (incidencias que sigues) -----------------------------
email.issueChanges.intro=Esto es todo lo que ha cambiado en esta incidencia desde tu última notificación.
email.issueChanges.section=Cambios
email.issueChanges.unsubscribe=Recibes este mensaje porque sigues esta incidencia. Puedes dejar de seguirla en la propia incidencia o desactivar estos correos en Cuenta → Notificaciones.

# ---- líneas de asunto -------------------------------------------------------
# Eran ternarios de Java entre alemán e inglés hasta que la plataforma aprendió
# un tercer idioma. {0} es la organización a la que pertenece la instancia.
email.subject.verifyEmail=Confirma tu dirección de correo
email.subject.approvalRequest=Un nuevo registro espera aprobación
email.subject.emailChange=Confirma tu nueva dirección de correo
email.subject.passwordReset=Restablece tu contraseña
email.subject.dataReport=Tu exportación de datos está lista
email.subject.invite=Te han invitado a {0}
email.subject.weeklySummary=Tu resumen semanal
email.subject.issueChanges={0}: {1}
email.subject.issueChange.one=cambio
email.subject.issueChange.many=cambios
