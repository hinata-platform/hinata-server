# 日本語のメール文面。templates/email/ 配下の Thymeleaf テンプレートが #{...} で
# 参照し、MailService がモデルの `locale` キーから導いた Locale で解決します。
# キーは email-messages.properties と同期させてください。
#
# {0} 形式の引数を取るメッセージは MessageFormat を通るため、その中の半角
# アポストロフィは必ず二重（''）にしてください。引数のないメッセージでは
# 二重にしません。日本語の文面では鉤括弧を使うため、この問題は起きません。

# ---- 共通の枠 ---------------------------------------------------------------
email.brand=Hinata
email.masthead.alt=Hinata
# {0} はこのインスタンスが属する組織です。メールはその組織から送られます。
# Hinata はその基盤にすぎず、それは下の poweredBy が伝えます。
email.footer.automated=これは {0} からの自動送信メールです。
email.footer.automatedAdmin=これは {0} からの自動送信メールです。ご不明な点は管理者にお問い合わせください。
email.footer.poweredBy=Powered by Hinata · セルフホスト型のプロジェクト & 課題管理
email.cta.fallback=ボタンが動かない場合は、このリンクをブラウザーに貼り付けてください:
# あえて中立にしています。受信者が開くのは自分たちのトラッカーであって、
# 私たちの製品ではありません。
email.cta.open=課題を開く
email.greeting={0} さん

# ---- 一般的な通知 -----------------------------------------------------------
email.notification.eyebrow=通知
email.eyebrow.ISSUE_ASSIGNED=あなたに割り当て
email.eyebrow.ISSUE_UPDATED=課題を更新
email.eyebrow.ISSUE_COMMENTED=新しいコメント
email.eyebrow.ISSUE_INGESTED=メールからの新しい課題
email.eyebrow.ISSUE_DUE_SOON=期限が近づいています
email.eyebrow.MENTION=メンションされました
email.eyebrow.COMMENT_REPLY=コメントへの返信
email.eyebrow.SPRINT_STARTED=スプリント開始
email.eyebrow.SPRINT_COMPLETED=スプリント完了
email.eyebrow.DIGEST=ダイジェスト
email.eyebrow.SECURITY_ALERT=セキュリティ
email.eyebrow.SYSTEM=通知
email.eyebrow.TEAM_ADDED=チーム
email.eyebrow.TEAM_ROLE_CHANGED=チーム
email.eyebrow.TEAM_REMOVED=チーム
email.eyebrow.PROJECT_ADDED=プロジェクト

# ---- 新規登録: メールアドレスの確認 -----------------------------------------
email.verify.eyebrow=ようこそ
email.verify.headline=メールアドレスを確認してください
email.verify.body={0} へようこそ。メールアドレスを確認するとアカウントが有効になり、チームでの作業管理を始められます。
email.verify.cta=メールアドレスを確認
email.verify.expiry=このリンクは {0} 時間有効です。
email.verify.ignore=登録に心当たりがない場合は、このメールを無視してかまいません。

# ---- 招待 -------------------------------------------------------------------
email.invite.eyebrow=招待
email.invite.headline={0} に招待されました
email.invite.body={0} さんがあなたを {1} ワークスペースに招待しました。
email.invite.note=メッセージ
email.invite.setup=以下からアカウントを設定し、パスワードを決めてください。1 分ほどで完了します。
email.invite.cta=アカウントを設定
email.invite.expiry=この招待は {0} 日間有効です。
email.invite.ignore=心当たりがない場合は、このメールを無視してかまいません。

# ---- パスワードの再設定 -----------------------------------------------------
email.reset.eyebrow=セキュリティ
email.reset.headline=パスワードを再設定してください
email.reset.body={0} のパスワード再設定がリクエストされました。下のボタンから新しいパスワードを設定してください。
email.reset.cta=新しいパスワードを設定
email.reset.expiry=このリンクは {0} 分間有効で、1 回だけ使用できます。
email.reset.ignore=心当たりがない場合、パスワードは変更されないままです。対応は不要です。

# ---- メールアドレスの変更 ---------------------------------------------------
email.emailChange.eyebrow=セキュリティ
email.emailChange.headline=新しいメールアドレスを確認してください
email.emailChange.body=ログインに使うメールアドレスの変更がリクエストされました。新しいアドレスを確認すると変更が完了します。
email.emailChange.newAddress=新しいアドレス
email.emailChange.cta=メールアドレスを確認
email.emailChange.expiry=このリンクは {0} 時間有効です。確認するまでは現在のアドレスがそのまま使えます。
email.emailChange.ignore=心当たりがない場合は、このメールを無視してかまいません。

# ---- 承認依頼（管理者向け）-------------------------------------------------
email.approval.eyebrow=管理者
email.approval.headline=新しい登録が承認を待っています
email.approval.body=新規登録があり、メールアドレスの確認も完了しました。ログインするにはあなたの承認が必要です。
email.approval.cta=登録を確認する
email.approval.note=あなたが {0} を管理しているため、このメールが届いています。

# ---- データのエクスポート（GDPR 第 15 条）----------------------------------
email.export.eyebrow=あなたのデータ
email.export.headline=データのエクスポートが完成しました
email.export.body=GDPR 第 15 条にもとづいてリクエストされたデータのエクスポートを作成しました。ダウンロードできます。
email.export.cta=データをダウンロード（PDF）
email.export.expiry=この個人用ダウンロードリンクは {0} 時間有効です。
email.export.warning=このリンクは共有しないでください。データのエクスポート全体にアクセスできてしまいます。

# ---- アカウントの状態 -------------------------------------------------------
email.account.eyebrow=あなたのアカウント
email.account.activated.headline=アカウントが有効になりました
email.account.activated.body=管理者によって {0} のアカウントが有効化されました。これからふたたびログインできます。
email.account.activated.cta={0} にログイン
email.account.deactivated.headline=アカウントが無効になりました
email.account.deactivated.body={0} のアカウントが無効化されたため、当面はログインできません。データは保持され、いつでも再度有効にできます。
email.account.deleted.headline=アカウントを削除しました
email.account.deleted.body={0} のアカウントを完全に削除し、すべてのアクセス権を取り消しました。この操作は取り消せません。
email.account.mistake=手違いだと思われる場合は、管理者にお問い合わせください。
email.account.roles.headline=ロールが更新されました
email.account.roles.granted={0} で管理者権限が付与されました。管理エリアとユーザー管理を利用できます。
email.account.roles.revoked={0} での管理者権限が取り消されました。通常のメンバーとしては引き続き利用できます。
email.account.roles.current=現在のロール

# ---- 週次サマリー -----------------------------------------------------------
email.weekly.eyebrow=週次サマリー
email.weekly.headline=今週のふりかえり
email.weekly.intro=この 1 週間の出来事と、これからの予定をまとめました。
email.weekly.behind=過ぎた 1 週間
email.weekly.completed=完了
email.weekly.created=作成
email.weekly.focus=集中した時間
email.weekly.sprint=進行中のスプリント
email.weekly.sprintDay={1} 日中 {0} 日目
email.weekly.sprintIssues={1} 件中 {0} 件が完了
email.weekly.contributors=貢献の多いメンバー
email.weekly.contributorDone=件完了
email.weekly.highlights=完了した主な課題
email.weekly.ahead=これからの 1 週間
email.weekly.overdue={0} 件が期限切れ
email.weekly.empty=対応が必要なものはありません。すべて片づいています。
email.weekly.more=アプリにあと {0} 件
email.weekly.cta=サマリー全体を開く
email.weekly.footer=このサマリーは毎週送信されます。通知設定でオフにできます。

# ---- 課題の変更のまとめ（ウォッチ中の課題）---------------------------------
email.issueChanges.intro=前回の通知以降にこの課題で変わった点をまとめました。
email.issueChanges.section=変更
email.issueChanges.unsubscribe=この課題をウォッチしているため、このメールが届いています。課題の画面でウォッチを解除するか、アカウント → 通知でこのメールをオフにできます。

# ---- 件名 -------------------------------------------------------------------
# このプラットフォームが 3 言語目を覚えるまでは、Java 内のドイツ語と英語の
# 三項演算子でした。{0} はこのインスタンスが属する組織です。
email.subject.verifyEmail=メールアドレスを確認してください
email.subject.approvalRequest=新しい登録が承認を待っています
email.subject.emailChange=新しいメールアドレスを確認してください
email.subject.passwordReset=パスワードを再設定してください
email.subject.dataReport=データのエクスポートが完成しました
email.subject.invite={0} に招待されました
email.subject.weeklySummary=今週のまとめ
email.subject.issueChanges={0}: {1}
