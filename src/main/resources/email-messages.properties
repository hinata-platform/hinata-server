# Default (English) e-mail copy. Resolved by the Thymeleaf templates under
# templates/email/ via #{...}, against the Locale that MailService derives from
# the model's `locale` key. Keep keys in sync with email-messages_de.properties.
#
# Messages that take {0}-style arguments go through MessageFormat, so a literal
# apostrophe in those MUST be doubled ('') — plain messages must NOT double it.

