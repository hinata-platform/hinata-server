# Тексты писем на русском языке. Их подставляют шаблоны Thymeleaf из
# templates/email/ через #{...} по локали, которую MailService берёт из ключа
# `locale` в модели. Ключи держите синхронными с email-messages.properties.
#
# Сообщения с аргументами вида {0} проходят через MessageFormat, поэтому
# литеральный апостроф в них ОБЯЗАН быть удвоен (''); в сообщениях без
# аргументов — НЕТ.

# ---- каркас письма ----------------------------------------------------------
email.brand=Hinata
email.masthead.alt=Hinata
# {0} — организация, которой принадлежит этот экземпляр. Письмо отправляет
# именно она; Hinata — только то, на чём она работает, и об этом говорит
# poweredBy ниже.
email.footer.automated=Это автоматическое сообщение от {0}.
email.footer.automatedAdmin=Это автоматическое сообщение от {0}. Если у вас есть вопросы, обратитесь к администратору.
email.footer.poweredBy=Работает на Hinata · Управление проектами и задачами на своём сервере
email.cta.fallback=Кнопка не работает? Скопируйте эту ссылку в браузер:
# Нейтрально намеренно: получатель открывает СВОЙ трекер, а не наш продукт.
email.cta.open=Открыть задачу
email.greeting=Здравствуйте, {0},

