email.emailChange.body=आपने वह ई-मेल पता बदलने का अनुरोध किया है जिससे आप साइन इन करते हैं। बदलाव पूरा करने के लिए नए पते की पुष्टि करें।
email.emailChange.newAddress=नया पता
email.emailChange.cta=ई-मेल पते की पुष्टि करें
email.emailChange.expiry=यह लिंक {0} घंटे तक वैध है। पुष्टि होने तक आपका मौजूदा पता सक्रिय रहेगा।
email.emailChange.ignore=अगर यह आपने नहीं किया, तो आप इस संदेश को अनदेखा कर सकते हैं।

# ---- स्वीकृति अनुरोध (व्यवस्थापकों को) --------------------------------------
email.approval.eyebrow=व्यवस्थापन
