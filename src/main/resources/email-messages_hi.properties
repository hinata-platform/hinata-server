email.approval.body=किसी ने साइन अप किया है और अपने ई-मेल पते की पुष्टि कर दी है। साइन इन करने से पहले उन्हें आपकी स्वीकृति चाहिए।
email.approval.cta=पंजीकरण देखें
email.approval.note=आपको यह संदेश इसलिए मिला है क्योंकि आप {0} का प्रशासन करते हैं।

# ---- डेटा निर्यात (GDPR अनुच्छेद 15) ----------------------------------------
email.export.eyebrow=आपका डेटा
email.export.headline=आपका डेटा निर्यात तैयार है
email.export.body=GDPR अनुच्छेद 15 के तहत आपके द्वारा माँगा गया डेटा निर्यात तैयार हो गया है और डाउनलोड के लिए उपलब्ध है।
email.export.cta=मेरा डेटा डाउनलोड करें (PDF)
email.export.expiry=यह व्यक्तिगत डाउनलोड लिंक {0} घंटे तक वैध है।
email.export.warning=यह लिंक किसी के साथ साझा न करें — यह आपके पूरे डेटा निर्यात तक पहुँच देता है।

