email.invite.ignore=अगर आपको इसकी उम्मीद नहीं थी, तो आप इस ई-मेल को अनदेखा कर सकते हैं।

# ---- पासवर्ड रीसेट ----------------------------------------------------------
email.reset.eyebrow=सुरक्षा
email.reset.headline=अपना पासवर्ड रीसेट करें
email.reset.body=आपने अपना {0} पासवर्ड रीसेट करने का अनुरोध किया है। नीचे दिए बटन से नया पासवर्ड चुनें।
email.reset.cta=नया पासवर्ड बनाएँ
email.reset.expiry=यह लिंक {0} मिनट तक वैध है और केवल एक बार उपयोग किया जा सकता है।
email.reset.ignore=अगर यह आपने नहीं किया, तो आपका पासवर्ड अपरिवर्तित रहेगा और आपको कुछ करने की ज़रूरत नहीं है।

# ---- ई-मेल पता बदलना --------------------------------------------------------
email.emailChange.eyebrow=सुरक्षा
