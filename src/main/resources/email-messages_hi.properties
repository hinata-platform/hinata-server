email.account.eyebrow=आपका खाता
email.account.activated.headline=आपका खाता सक्रिय कर दिया गया है
email.account.activated.body=आपका {0} खाता किसी व्यवस्थापक ने सक्रिय कर दिया है। अब से आप दोबारा साइन इन कर सकते हैं।
email.account.activated.cta={0} में साइन इन करें
email.account.deactivated.headline=आपका खाता निष्क्रिय कर दिया गया है
email.account.deactivated.body=आपका {0} खाता निष्क्रिय कर दिया गया है, इसलिए फ़िलहाल आप साइन इन नहीं कर सकते। आपका डेटा सुरक्षित रहेगा और खाता कभी भी दोबारा सक्रिय किया जा सकता है।
