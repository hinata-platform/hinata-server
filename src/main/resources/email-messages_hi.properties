# हिन्दी ई-मेल टेक्स्ट। templates/email/ के Thymeleaf टेम्पलेट इन्हें #{...} से
# उस Locale के विरुद्ध चुनते हैं जिसे MailService मॉडल की `locale` कुंजी से निकालता
# है। कुंजियाँ email-messages.properties के साथ समान रखें।
#
# {0}-शैली के आर्गुमेंट वाले संदेश MessageFormat से गुज़रते हैं — उनमें असली
# एपॉस्ट्रॉफ़ी दोहरी ('') करनी होती है; बिना आर्गुमेंट वाले संदेशों में नहीं।

# ---- ढाँचा ------------------------------------------------------------------
email.brand=Hinata
email.masthead.alt=Hinata
# {0} वह संगठन है जिसका यह इंस्टेंस है। मेल उसी संगठन की ओर से जाती है; Hinata
# केवल उसके नीचे चलने वाला सॉफ़्टवेयर है — नीचे poweredBy देखें।
email.footer.automated=यह {0} की ओर से भेजा गया स्वचालित संदेश है।
email.footer.automatedAdmin=यह {0} की ओर से भेजा गया स्वचालित संदेश है। कोई प्रश्न हो तो अपने व्यवस्थापक से संपर्क करें।
email.footer.poweredBy=Hinata द्वारा संचालित · सेल्फ़-होस्टेड प्रोजेक्ट और इश्यू ट्रैकिंग
email.cta.fallback=बटन काम नहीं कर रहा? यह लिंक अपने ब्राउज़र में कॉपी करें:
# जानबूझकर तटस्थ: पढ़ने वाला अपना ट्रैकर खोल रहा है, हमारा उत्पाद नहीं।
email.cta.open=इश्यू खोलें
email.greeting=नमस्ते {0},

