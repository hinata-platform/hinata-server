email.account.deleted.body=आपका {0} खाता स्थायी रूप से हटा दिया गया है और सभी पहुँच वापस ले ली गई है। यह कार्रवाई पलटी नहीं जा सकती।
email.account.mistake=अगर आपको लगता है कि यह कोई भूल है, तो कृपया अपने व्यवस्थापक से संपर्क करें।
email.account.roles.headline=आपकी भूमिकाएँ अपडेट कर दी गई हैं
email.account.roles.granted=आपको {0} में व्यवस्थापक अधिकार दिए गए हैं। अब आपके पास एडमिन क्षेत्र और उपयोगकर्ता प्रबंधन तक पहुँच है।
email.account.roles.revoked={0} में आपके व्यवस्थापक अधिकार हटा दिए गए हैं। एक सामान्य सदस्य के रूप में आपकी पहुँच बनी हुई है।
