<!DOCTYPE html>
<!--/* An admin disabled the account; data is kept. NotificationService. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.account.eyebrow},
          #{email.account.deactivated.headline},
          #{email.account.deactivated.body},
          #{email.footer.automatedAdmin},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.greeting(${displayName})})}"/>
  <th:block th:replace="~{email/_layout :: copy(#{email.account.deactivated.body})}"/>

  <th:block th:replace="~{email/_layout :: rule}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.account.mistake})}"/>
</th:block>
</body>
</html>
