<!DOCTYPE html>
<!--/* To admins: a verified self-registration is waiting. AuthMailService. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.approval.eyebrow},
          #{email.approval.headline},
          #{email.approval.body},
          #{email.footer.automated},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.greeting(${displayName})})}"/>
  <th:block th:replace="~{email/_layout :: copy(#{email.approval.body})}"/>

  <!--/* Applicant card: name over address, so the admin can judge the request
       from the mail alone without opening the admin area first. */-->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 6px 0">
    <tr>
      <td class="hn-panel"
          style="background:#FAF9F6;border:1px solid #E7E5DE;border-radius:12px;padding:16px 18px">
        <div class="hn-ink"
             style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                    font-size:16px;font-weight:700;line-height:1.35;color:#23223F"
             th:text="${newUserName}">New User</div>
        <div class="hn-mono"
             style="font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;
                    line-height:1.5;color:#B9831F;margin-top:3px;word-break:break-all"
             th:text="${newUserEmail}">new@example.com</div>
      </td>
    </tr>
  </table>

  <th:block th:replace="~{email/_layout :: cta(${reviewUrl}, #{email.approval.cta})}"/>
  <th:block th:replace="~{email/_layout :: fallback(${reviewUrl})}"/>

  <th:block th:replace="~{email/_layout :: rule}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.approval.note})}"/>
</th:block>
</body>
</html>
