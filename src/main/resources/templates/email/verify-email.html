<!DOCTYPE html>
<!--/* Sign-up: confirm the address to activate the account. AuthMailService. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.verify.eyebrow},
          #{email.verify.headline},
          #{email.verify.body},
          #{email.footer.automated},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.greeting(${displayName})})}"/>
  <th:block th:replace="~{email/_layout :: copy(#{email.verify.body})}"/>

  <th:block th:replace="~{email/_layout :: cta(${verifyUrl}, #{email.verify.cta})}"/>
  <th:block th:replace="~{email/_layout :: fallback(${verifyUrl})}"/>

  <th:block th:replace="~{email/_layout :: rule}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.verify.expiry(${expiresHours})})}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.verify.ignore})}"/>
</th:block>
</body>
</html>
