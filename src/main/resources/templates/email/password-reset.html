<!DOCTYPE html>
<!--/* Forgot-password link. AccountMailService. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.reset.eyebrow},
          #{email.reset.headline},
          #{email.reset.body},
          #{email.footer.automated},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.greeting(${displayName})})}"/>
  <th:block th:replace="~{email/_layout :: copy(#{email.reset.body})}"/>

  <th:block th:replace="~{email/_layout :: cta(${resetUrl}, #{email.reset.cta})}"/>
  <th:block th:replace="~{email/_layout :: fallback(${resetUrl})}"/>

  <th:block th:replace="~{email/_layout :: rule}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.reset.expiry(${expiresMinutes})})}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.reset.ignore})}"/>
</th:block>
</body>
</html>
