<!DOCTYPE html>
<!--/* Confirm a new sign-in address. Sent to the NEW address. AccountMailService. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.emailChange.eyebrow},
          #{email.emailChange.headline},
          #{email.emailChange.body},
          #{email.footer.automated},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.greeting(${displayName})})}"/>
  <th:block th:replace="~{email/_layout :: copy(#{email.emailChange.body})}"/>

  <th:block th:replace="~{email/_layout :: panel(#{email.emailChange.newAddress}, ${newEmail})}"/>

  <th:block th:replace="~{email/_layout :: cta(${confirmUrl}, #{email.emailChange.cta})}"/>
  <th:block th:replace="~{email/_layout :: fallback(${confirmUrl})}"/>

  <th:block th:replace="~{email/_layout :: rule}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.emailChange.expiry(${expiresHours})})}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.emailChange.ignore})}"/>
</th:block>
</body>
</html>
