<!DOCTYPE html>
<!--/*
  What arrived outside the recipient's notification window (HIN-131), sent once
  when the window opens instead of one mail per notification in the night.

  `items` are HeldNotifications.Item (title, body, link), newest first, at most
  HeldNotifications.MAIL_ITEMS of them; `more` counts the ones left out. Titles
  and bodies were localized when the notifications were written. Each row links
  into the app; the CTA opens the bell.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.held.eyebrow},
          #{email.held.headline},
          #{email.held.intro},
          #{email.footer.automated(${organizationName})},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.greeting(${displayName})})}"/>
  <th:block th:replace="~{email/_layout :: copy(#{email.held.intro})}"/>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 6px 0">
    <tr th:each="item : ${items}">
      <td style="padding:0 0 8px 0">
        <a th:href="${item.link}" style="text-decoration:none;display:block">
          <div class="hn-panel"
               style="background:#FAF9F6;border:1px solid #E7E5DE;border-radius:12px;padding:12px 16px">
            <div class="hn-ink"
                 style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                        font-size:14.5px;font-weight:600;line-height:1.4;color:#23223F;word-break:break-word"
                 dir="auto" th:text="${item.title}">Title</div>
            <div class="hn-soft" th:if="${item.body != null and !#strings.isEmpty(item.body)}"
                 style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                        font-size:13px;line-height:1.45;color:#5E5D78;margin-top:3px;word-break:break-word"
                 dir="auto" th:text="${item.body}">Body</div>
          </div>
        </a>
      </td>
    </tr>
  </table>

  <th:block th:if="${more > 0}">
    <th:block th:replace="~{email/_layout :: fineprint(#{email.held.more(${more})})}"/>
  </th:block>

  <th:block th:replace="~{email/_layout :: cta(${ctaLink}, #{email.held.cta})}"/>
  <th:block th:replace="~{email/_layout :: fallback(${ctaLink})}"/>
</th:block>
</body>
</html>
