<!DOCTYPE html>
<!--/* Admin privileges granted or revoked. NotificationService. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.account.eyebrow},
          #{email.account.roles.headline},
          ${isAdmin} ? #{email.account.roles.granted} : #{email.account.roles.revoked},
          #{email.footer.automatedAdmin},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.greeting(${displayName})})}"/>
  <th:block th:if="${isAdmin}" th:replace="~{email/_layout :: copy(#{email.account.roles.granted})}"/>
  <th:block th:unless="${isAdmin}" th:replace="~{email/_layout :: copy(#{email.account.roles.revoked})}"/>

  <th:block th:replace="~{email/_layout :: panel(#{email.account.roles.current}, ${roles})}"/>
</th:block>
</body>
</html>
