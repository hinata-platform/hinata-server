<!DOCTYPE html>
<!--/* Workspace invitation, carries the sign-up link. AdminMailService. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.invite.eyebrow},
          #{email.invite.headline},
          #{email.invite.body(${inviterName})},
          #{email.footer.automated},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.invite.body(${inviterName})})}"/>

  <!--/* The inviter's personal note, when they wrote one — quoted rather than
       run into the body copy so it reads as their voice, not the system's. */-->
  <table th:if="${message != null and !message.isBlank()}" role="presentation" width="100%"
         cellpadding="0" cellspacing="0" border="0" style="margin:2px 0 18px 0">
    <tr>
      <td class="hn-accent"
          style="background:#F3E9D2;border-left:3px solid #D9A032;border-radius:0 12px 12px 0;padding:14px 18px">
        <div class="hn-eyebrow"
             style="font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:10.5px;
                    font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#B9831F;margin:0 0 6px 0"
             th:text="#{email.invite.note}">PERSONAL NOTE</div>
        <div class="hn-soft"
             style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                    font-size:14.5px;line-height:1.6;color:#6B4E12;white-space:pre-line"
             th:text="${message}">A personal note</div>
      </td>
    </tr>
  </table>

  <th:block th:replace="~{email/_layout :: copy(#{email.invite.setup})}"/>

  <th:block th:replace="~{email/_layout :: cta(${inviteUrl}, #{email.invite.cta})}"/>
  <th:block th:replace="~{email/_layout :: fallback(${inviteUrl})}"/>

  <th:block th:replace="~{email/_layout :: rule}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.invite.expiry(${expiresDays})})}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.invite.ignore})}"/>
</th:block>
</body>
</html>
