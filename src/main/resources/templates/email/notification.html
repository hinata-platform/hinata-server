<!DOCTYPE html>
<!--/*
  The workhorse: every bell notification that also goes out by mail — assigned,
  mentioned, commented, due soon, sprint started, security alert. Title and body
  are composed and localized by NotificationService; this template only dresses
  them. `eyebrowKey` names an email.eyebrow.<TYPE> message so the recipient can
  tell an assignment from a mention before reading a word.

  `lines` is optional and only an issue update carries it: the fields that
  changed, each as a before/after diff. The body copy above it stays — it is the
  same change squeezed onto one line, which is what the inbox preview and the
  push body show, and a mail that opened with a bare table would read as a
  machine's output rather than as a notice.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          ${eyebrowKey != null} ? #{__${eyebrowKey}__} : #{email.notification.eyebrow},
          ${headline},
          ${body},
          #{email.footer.automated(${organizationName})},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(${body})}"/>

  <th:block th:if="${lines != null and !#lists.isEmpty(lines)}">
    <th:block th:replace="~{email/_layout :: sectionLabel(#{email.issueChanges.section})}"/>
    <th:block th:each="line : ${lines}">
      <th:block th:replace="~{email/_layout :: diff(${line})}"/>
    </th:block>
  </th:block>

  <th:block th:if="${ctaLink != null}"
            th:replace="~{email/_layout :: cta(${ctaLink}, ${ctaLabel != null} ? ${ctaLabel} : #{email.cta.open})}"/>
  <th:block th:if="${ctaLink != null}" th:replace="~{email/_layout :: fallback(${ctaLink})}"/>
</th:block>
</body>
</html>
