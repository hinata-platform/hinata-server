<!DOCTYPE html>
<!--/* GDPR Art. 15 export is generated and downloadable. AccountMailService. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: page(
          #{email.export.eyebrow},
          #{email.export.headline},
          #{email.export.body},
          #{email.footer.automated},
          ~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{email/_layout :: copy(#{email.greeting(${displayName})})}"/>
  <th:block th:replace="~{email/_layout :: copy(#{email.export.body})}"/>

  <!--/* The one mail where the caveat outranks the action: this link is a
       bearer token for the recipient's entire personal record. */-->
  <th:block th:replace="~{email/_layout :: note(#{email.export.warning})}"/>

  <th:block th:replace="~{email/_layout :: cta(${downloadUrl}, #{email.export.cta})}"/>
  <th:block th:replace="~{email/_layout :: fallback(${downloadUrl})}"/>

  <th:block th:replace="~{email/_layout :: rule}"/>
  <th:block th:replace="~{email/_layout :: fineprint(#{email.export.expiry(${expiresHours})})}"/>
</th:block>
</body>
</html>
