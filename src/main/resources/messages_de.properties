# Inhaltsmoderation.
#
# Das ist die Begruendung, die der Nutzer bei einer Ablehnung sieht. Sie nennt
# bewusst die Kategorie und sagt, dass automatisch geprueft wurde, und sie verweist
# auf einen Menschen — eine Ablehnung ohne Begruendung ist schlechtes Produkt und
# fuer einen Hosting-Dienst nach DSA Art. 17 nicht ausreichend. Sie nennt bewusst
# NICHT den Treffer oder den Score: das macht den Filter zu einem Orakel, gegen das
# man iterieren kann. Die Belege bleiben am Moderationseintrag fuer die Pruefung.
error.moderation.blocked=Dein Inhalt wurde nicht gespeichert, weil er unseren Inhaltsrichtlinien nicht entspricht. Das war eine automatische Pruefung; wende dich an eine Administratorin oder einen Administrator, damit ein Mensch das prueft.
error.moderation.blockedReason=Dein Inhalt wurde nicht gespeichert, weil {0}. Das war eine automatische Pruefung; wende dich an eine Administratorin oder einen Administrator, damit ein Mensch das prueft.
error.moderation.blockedFile=Die Datei {0} wurde nicht hochgeladen, weil {1}. Das war eine automatische Pruefung; wende dich an eine Administratorin oder einen Administrator, damit ein Mensch das prueft.
error.moderation.unavailable=Dieser Inhalt konnte gerade nicht geprueft werden und wurde deshalb nicht angenommen. Bitte versuche es in ein paar Minuten erneut.
error.moderation.reportSelf=Du kannst deine eigenen Inhalte nicht melden
error.moderation.reportDuplicate=Das hast du bereits gemeldet
error.moderation.reportRateLimited=Du hast in kurzer Zeit viele Meldungen abgegeben. Bitte warte einen Moment.
error.moderation.blockSelf=Du kannst dich nicht selbst blockieren
error.moderation.notFound=Diese Meldung existiert nicht mehr
# Der einzige Schreibzugriff der Admin-Warteschlange. Bewusst abgelehnt statt als
# No-op akzeptiert: "offen lassen" und "ich habe nichts entschieden" sehen in einer
# Warteschlange gleich aus, und die Moderation muesste raten, was passiert ist.
error.moderation.decisionRequired=Eine Entscheidung muss den Eintrag schliessen - bestaetigen oder verwerfen

# Die Begruendungen, die oben eingesetzt werden. So formuliert, dass sie den Satz
# "Dein Inhalt wurde nicht gespeichert, weil ..." vervollstaendigen.
moderation.reason.sexual=er sexuelle oder pornografische Inhalte zu enthalten scheint
moderation.reason.sexualMinors=er sexuelle Inhalte mit Minderjaehrigen zu enthalten scheint
moderation.reason.violence=er drastische Gewaltdarstellungen zu enthalten scheint
moderation.reason.violentThreat=er eine Gewaltandrohung gegen eine Person zu enthalten scheint
