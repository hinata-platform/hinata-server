# Sprachnachrichten laufen nicht ueber StorageService und haben deshalb ihre eigene
# Meldung fuer eine Signatur-Abweichung. Bewusst verschieden von error.voice.notAudio:
# "notAudio" heisst, die falsche Datei wurde angehaengt, das hier heisst, die Bytes
# geben sich als Audio aus und sind es nicht.
error.voice.contentMismatch=Diese Aufnahme ist nicht das Audioformat, das sie angibt zu sein

