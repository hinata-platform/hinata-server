moderation.reason.selfHarm=er Selbstverletzung zu befuerworten scheint
moderation.reason.extremism=er extremistische Inhalte zu enthalten scheint
moderation.reason.illegal=er illegale Inhalte zu enthalten scheint
moderation.reason.malware=die Datei schaedlich zu sein scheint
moderation.reason.generic=er unseren Inhaltsrichtlinien nicht entspricht

