# Textes des e-mails en français. Ils sont résolus par les modèles Thymeleaf de
# templates/email/ via #{...}, d'après la Locale que MailService déduit de la
# clé `locale` du modèle. Garder les clés synchronisées avec
# email-messages.properties.
#
# Les messages qui prennent des arguments du type {0} passent par MessageFormat :
# une apostrophe littérale y DOIT être doublée ('') ; dans les messages sans
# argument, elle ne doit PAS l'être.

# ---- habillage --------------------------------------------------------------
email.brand=Hinata
email.masthead.alt=Hinata
# {0} est l'organisation à laquelle appartient l'instance. L'e-mail est envoyé
# PAR cette organisation ; Hinata n'est que le logiciel sur lequel elle
# fonctionne, comme l'indique poweredBy ci-dessous.
email.footer.automated=Ce message automatique vous est envoyé par {0}.
email.footer.automatedAdmin=Ce message automatique vous est envoyé par {0}. Pour toute question, contactez votre administrateur.
email.footer.poweredBy=Propulsé par Hinata · Gestion de projets et de tickets auto-hébergée
email.cta.fallback=Le bouton ne fonctionne pas ? Copiez ce lien dans votre navigateur :
# Volontairement neutre : la personne ouvre SON outil de suivi, pas notre produit.
email.cta.open=Ouvrir le ticket
email.greeting=Bonjour {0},

