email.reset.cta=Définir un nouveau mot de passe
email.reset.expiry=Ce lien est valable {0} minutes et ne peut servir qu''une seule fois.
email.reset.ignore=Si vous n'êtes pas à l'origine de cette demande, votre mot de passe reste inchangé et vous n'avez rien à faire.

