email.invite.cta=Configurer votre compte
email.invite.expiry=Cette invitation est valable {0} jours.
email.invite.ignore=Si vous ne vous attendiez pas à ce message, vous pouvez l'ignorer sans crainte.

# ---- réinitialisation du mot de passe ---------------------------------------
email.reset.eyebrow=Sécurité
email.reset.headline=Réinitialisez votre mot de passe
