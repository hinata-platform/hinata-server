email.eyebrow.TEAM_REMOVED=Équipe
email.eyebrow.PROJECT_ADDED=Projet

# ---- inscription : confirmation de l'adresse e-mail -------------------------
email.verify.eyebrow=Bienvenue
email.verify.headline=Confirmez votre adresse e-mail
email.verify.body=Bienvenue dans {0}. Confirmez votre adresse e-mail pour activer votre compte et commencer à suivre le travail de votre équipe.
email.verify.cta=Confirmer l'adresse e-mail
email.verify.expiry=Ce lien est valable {0} heures.
email.verify.ignore=Si vous n'êtes pas à l'origine de cette inscription, vous pouvez ignorer cet e-mail sans crainte.

