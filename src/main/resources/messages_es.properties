# Exportaciones de incidencias (PDF / DOCX / XLSX / XML). Todo lo que dice un
# documento exportado y que no es contenido: etiquetas de campo, títulos de
# sección, cabeceras de tabla y los valores de enumeración que si no saldrían
# impresos como SHOWSTOPPER o SUBTASK. Se resuelve con el idioma de la petición,
# de modo que el documento se escribe en el idioma de la aplicación que lo pidió.
