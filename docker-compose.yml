# Hinata production deployment: server + MongoDB replica set (2 data nodes
# + 1 arbiter) + SeaweedFS object storage. Copy .env.example to .env first and
# run ./deploy/generate-secrets.sh to create the Mongo keyfile and the secrets.
#
# Object storage: the bundled SeaweedFS runs when the "local-storage" profile is
# active (COMPOSE_PROFILES=local-storage, the default in .env.example). To use
# an external store instead (AWS S3, Google Cloud Storage, Azure Blob, R2, …),
# clear COMPOSE_PROFILES and set the HINATA_STORAGE_* / HINATA_S3_* /
# HINATA_AZURE_* variables in .env — see .env.example and README "Object
# storage".
name: hinata

x-mongo-common: &mongo-common
  image: mongo:8.0
  restart: unless-stopped
  # Internal cluster auth via keyfile (SCRAM); client connections require TLS and
  # the app authenticates with a X.509 client certificate. Generate the PKI with
  #   ./deploy/x509/generate-certs.sh prod
  command: >-
    mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo/keyfile
    --tlsMode requireTLS
    --tlsCertificateKeyFile /etc/mongo/certs/server.pem
    --tlsCAFile /etc/mongo/certs/ca.crt
  volumes:
    - ./deploy/mongo-keyfile:/etc/mongo/keyfile:ro
    - ./deploy/x509/prod:/etc/mongo/certs:ro
  networks: [hinata]

services:
  mongo1:
    <<: *mongo-common
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
    volumes:
      - mongo1-data:/data/db
      - ./deploy/mongo-keyfile:/etc/mongo/keyfile:ro
    healthcheck:
      # Initiates the replica set on first run, then reports member health.
      test: >-
        mongosh --quiet --tls --tlsCAFile /etc/mongo/certs/ca.crt
        --tlsCertificateKeyFile /etc/mongo/certs/server.pem --host mongo1
        -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin
        --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id: 'rs0', members: [
            {_id: 0, host: 'mongo1:27017', priority: 2},
            {_id: 1, host: 'mongo2:27017', priority: 1},
            {_id: 2, host: 'mongo-arbiter:27017', arbiterOnly: true}
          ]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  mongo2:
    <<: *mongo-common
    volumes:
      - mongo2-data:/data/db
      - ./deploy/mongo-keyfile:/etc/mongo/keyfile:ro

  mongo-arbiter:
    <<: *mongo-common
    # Arbiter holds no data; it only votes in elections.

  # S3 store: SeaweedFS (deploy/seaweedfs/entrypoint.sh). Credentials are required, objects are
  # encrypted with SSE-S3 under SEAWEEDFS_SSE_KEK (keep a copy of it apart from the data: without
  # it nothing stored can be read), and requests between its parts are signed. Nothing is
  # published: only hinata-server talks to it, over the stack network.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # Only started with COMPOSE_PROFILES=local-storage (the default). Turn the
    # profile off when Hinata points at an external object store.
    profiles: [local-storage]
    entrypoint: ["/bin/sh", "/opt/hinata/entrypoint.sh"]
    environment: &seaweedfs-env
      HINATA_S3_BUCKET: ${HINATA_S3_BUCKET:-hinata}
      HINATA_S3_ACCESS_KEY: ${HINATA_S3_ACCESS_KEY:-}
      HINATA_S3_SECRET_KEY: ${HINATA_S3_SECRET_KEY:-}
      SEAWEEDFS_ADMIN_ACCESS_KEY: ${SEAWEEDFS_ADMIN_ACCESS_KEY:-}
      SEAWEEDFS_ADMIN_SECRET_KEY: ${SEAWEEDFS_ADMIN_SECRET_KEY:-}
      WEED_S3_SSE_KEK: ${SEAWEEDFS_SSE_KEK:-}
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_JWT_VOLUME_WRITE:-}
      WEED_JWT_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_VOLUME_READ:-}
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_JWT_FILER_WRITE:-}
      WEED_JWT_FILER_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_FILER_READ:-}
    volumes:
      - seaweedfs-data:/data
      - ./deploy/seaweedfs:/opt/hinata:ro
    networks: [hinata]

  # Creates the bucket once and asks for SSE-S3 as its default, then exits.
  seaweedfs-setup:
    image: amazon/aws-cli:2.31.13
    profiles: [local-storage]
    entrypoint: ["/bin/sh", "/opt/hinata/setup.sh"]
    depends_on: [seaweedfs]
    environment:
      <<: *seaweedfs-env
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./deploy/seaweedfs:/opt/hinata:ro
    networks: [hinata]

  hinata-server:
    # Pulled from GHCR (built & pushed by CI). No build context is needed on the
    # deployment host / Portainer. Pin a release by setting HINATA_SERVER_TAG.
    image: ghcr.io/hinata-platform/hinata-server:${HINATA_SERVER_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mongo1:
        condition: service_healthy
      seaweedfs:
        condition: service_started
        # Optional: satisfied by the local-storage profile; ignored when the
        # stack uses an external object store and SeaweedFS is not started.
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      HINATA_BASE_URL: ${HINATA_BASE_URL:?set in .env}
      # Frontend (Flutter web) base URL — email deep links point here.
      HINATA_WEB_BASE_URL: ${HINATA_WEB_BASE_URL:-}
      HINATA_JWT_SECRET: ${HINATA_JWT_SECRET:?set in .env}
      # Key for the stored calendar subscription URLs (Base64, at least 32 bytes).
      # Empty keeps calendar subscriptions off; see HinataProperties.Ics.
      HINATA_ICS_SECRET: ${HINATA_ICS_SECRET:-}
      HINATA_ICS_ALLOWED_HOSTS: ${HINATA_ICS_ALLOWED_HOSTS:-}
      HINATA_ICS_DENIED_HOSTS: ${HINATA_ICS_DENIED_HOSTS:-}
      # Planned minutes per weekday, Monday first, for people without their own.
      HINATA_AVAILABILITY_DEFAULT_WEEKDAY_MINUTES: ${HINATA_AVAILABILITY_DEFAULT_WEEKDAY_MINUTES:-480,480,480,480,480,0,0}
      # X.509 client auth over TLS (no password in the URI). The app presents the
      # client certificate from HINATA_MONGO_TLS_KEYSTORE; register its subject DN
      # as the $external user via deploy/x509/init-prod-user.sh.
      HINATA_MONGODB_URI: mongodb://mongo1:27017,mongo2:27017/hinata?replicaSet=rs0&tls=true&authMechanism=MONGODB-X509&authSource=$$external
      HINATA_MONGO_TLS_ENABLED: "true"
      HINATA_MONGO_TLS_KEYSTORE: /etc/hinata/x509/hinata-app.p12
      HINATA_MONGO_TLS_KEYSTORE_PASSWORD: ${HINATA_MONGO_TLS_KEYSTORE_PASSWORD:?set in .env}
      HINATA_MONGO_TLS_TRUSTSTORE: /etc/hinata/x509/truststore.p12
      HINATA_MONGO_TLS_TRUSTSTORE_PASSWORD: ${HINATA_MONGO_TLS_TRUSTSTORE_PASSWORD:?set in .env}
      HINATA_TRUSTED_PROXIES: ${HINATA_TRUSTED_PROXIES:-}
      HINATA_SMTP_HOST: ${HINATA_SMTP_HOST:-mailpit}
      HINATA_SMTP_PORT: ${HINATA_SMTP_PORT:-1025}
      HINATA_SMTP_USERNAME: ${HINATA_SMTP_USERNAME:-}
      HINATA_SMTP_PASSWORD: ${HINATA_SMTP_PASSWORD:-}
      HINATA_SMTP_AUTH: ${HINATA_SMTP_AUTH:-false}
      HINATA_SMTP_STARTTLS: ${HINATA_SMTP_STARTTLS:-false}
      HINATA_MAIL_FROM: ${HINATA_MAIL_FROM:-hinata@localhost}
      # Object storage. Defaults target the bundled SeaweedFS (local-storage
      # profile), which encrypts only what is asked to be encrypted, hence
      # HINATA_S3_SSE. Override in .env for AWS S3 / GCS interop / R2 / Spaces,
      # or set HINATA_STORAGE_PROVIDER=azure + HINATA_AZURE_CONNECTION_STRING
      # for Azure Blob Storage.
      HINATA_STORAGE_PROVIDER: ${HINATA_STORAGE_PROVIDER:-s3}
      HINATA_S3_ENDPOINT: ${HINATA_S3_ENDPOINT:-http://seaweedfs:8333}
      HINATA_S3_ACCESS_KEY: ${HINATA_S3_ACCESS_KEY:-}
      HINATA_S3_SECRET_KEY: ${HINATA_S3_SECRET_KEY:-}
      HINATA_S3_BUCKET: ${HINATA_S3_BUCKET:-hinata}
      HINATA_S3_REGION: ${HINATA_S3_REGION:-us-east-1}
      HINATA_S3_ADDRESSING_STYLE: ${HINATA_S3_ADDRESSING_STYLE:-path}
      HINATA_S3_SSE: ${HINATA_S3_SSE:-}
      HINATA_AZURE_CONNECTION_STRING: ${HINATA_AZURE_CONNECTION_STRING:-}
      HINATA_PRIVACY_POLICY_URL: ${HINATA_PRIVACY_POLICY_URL:-}
      HINATA_APP_MIN_VERSION: ${HINATA_APP_MIN_VERSION:-1.0.0}
      HINATA_CORS_ALLOWED_ORIGINS: ${HINATA_CORS_ALLOWED_ORIGINS:-}
      HINATA_SETUP_AUTO_COMPLETE: ${HINATA_SETUP_AUTO_COMPLETE:-false}
      HINATA_SETUP_ORGANIZATION_NAME: ${HINATA_SETUP_ORGANIZATION_NAME:-}
      HINATA_SETUP_ADMIN_EMAIL: ${HINATA_SETUP_ADMIN_EMAIL:-}
      HINATA_SETUP_ADMIN_USERNAME: ${HINATA_SETUP_ADMIN_USERNAME:-}
      HINATA_SETUP_ADMIN_PASSWORD: ${HINATA_SETUP_ADMIN_PASSWORD:-}
      HINATA_SETUP_ADMIN_DISPLAY_NAME: ${HINATA_SETUP_ADMIN_DISPLAY_NAME:-}
      # Push + universal-link deep links go through the central Hinata Connect
      # gateway (no per-server Firebase). The URL is a shared constant; override
      # only for testing. See HinataProperties.Gateway.
      HINATA_GATEWAY_BASE_URL: ${HINATA_GATEWAY_BASE_URL:-https://connect.hinata.ahmadre.com}
    volumes:
      # App client certificate (keystore) + CA (truststore) for MONGODB-X509.
      - ./deploy/x509/prod/hinata-app.p12:/etc/hinata/x509/hinata-app.p12:ro
      - ./deploy/x509/prod/truststore.p12:/etc/hinata/x509/truststore.p12:ro
    ports:
      # Published on the host port the reverse proxy (cloud.asta.hn) forwards
      # api.track.asta.hn:443 → host:3356 to. Override with HINATA_PORT.
      - "${HINATA_PORT:-3356}:8080"
    networks: [hinata]

volumes:
  mongo1-data:
  mongo2-data:
  seaweedfs-data:

networks:
  hinata:
    driver: bridge
