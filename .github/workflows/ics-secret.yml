# Puts HINATA_ICS_SECRET into the two production stacks on ASTASRV01.
#
# The box takes no SSH (port 22 answers nothing), and its Portainer stack records
# are stale — a redeploy through them would spawn duplicates on the NAS. What is
# left, and what the ordinary deploy already uses, is the self-hosted runner that
# lives on the box with the host docker socket. So this runs there.
#
# Manual only, and never on a fork: the runner holds that socket.
name: ICS secret

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = report structure only; apply = write the secret and recreate the server"
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]

jobs:
  ics-secret:
    name: Set HINATA_ICS_SECRET on asta + bear
    runs-on: [self-hosted, astasrv01]
    steps:
      - name: ${{ inputs.mode }}
        env:
          MODE: ${{ inputs.mode }}
          SECRET_HINATA: ${{ secrets.HINATA_ICS_SECRET_ASTA }}
          SECRET_HINATA_BEAR: ${{ secrets.HINATA_ICS_SECRET_BEAR }}
        run: |
          set -euo pipefail
          # This repository is public, so its logs are. Nothing below prints a
          # file, a line of one, or a value — only whether things are there.
          for STACK in hinata hinata-bear; do
            DIR="/opt/stacks/$STACK"
            echo "::group::$STACK"
            test -d "$DIR" || { echo "no such stack directory"; exit 1; }
            COMPOSE="$DIR/docker-compose.yml"
            test -f "$COMPOSE" || { echo "no docker-compose.yml"; exit 1; }

            echo "compose present:            yes"
            echo ".env present:               $(test -f "$DIR/.env" && echo yes || echo no)"
            echo "server service named:       $(grep -cE '^[[:space:]]+hinata-server:' "$COMPOSE" || true)"
            echo "env_file on any service:    $(grep -cE '^[[:space:]]+env_file:' "$COMPOSE" || true)"
            echo "HINATA_ICS_SECRET in compose: $(grep -c 'HINATA_ICS_SECRET' "$COMPOSE" || true)"
            echo "HINATA_ICS_SECRET in .env:  $(test -f "$DIR/.env" && (grep -c '^HINATA_ICS_SECRET=' "$DIR/.env" || true) || echo n/a)"
            echo "already set in container:   $(docker inspect "$STACK-hinata-server-1" \
                 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
                 | grep -c '^HINATA_ICS_SECRET=..*' || true)"
            echo "::endgroup::"
          done

          if [ "$MODE" != "apply" ]; then
            echo "inspect only — nothing written"
            exit 0
          fi

          for STACK in hinata hinata-bear; do
            DIR="/opt/stacks/$STACK"
            case "$STACK" in
              hinata) VALUE="$SECRET_HINATA" ;;
              hinata-bear) VALUE="$SECRET_HINATA_BEAR" ;;
            esac
            test -n "$VALUE" || { echo "::error::no secret configured for $STACK"; exit 1; }

            echo "::group::apply $STACK"
            # Idempotent: a value that is already there is left alone. Rotating
            # would make every stored subscription unreadable, and that is a
            # decision, not a side effect of running this twice.
            if docker inspect "$STACK-hinata-server-1" \
                 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
                 | grep -q '^HINATA_ICS_SECRET=..*'; then
              echo "already set — left untouched"
              echo "::endgroup::"
              continue
            fi

            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            cp -a "$DIR/docker-compose.yml" "$DIR/docker-compose.yml.bak-$STAMP"
            test -f "$DIR/.env" && cp -a "$DIR/.env" "$DIR/.env.bak-$STAMP" || true
            echo "backed up as *.bak-$STAMP"

            # The variable goes into the stack's .env, which compose reads for
            # ${...} interpolation, and the compose file gets the passthrough if
            # it has none. Writing the value into the .env keeps it out of the
            # file people read and paste from.
            touch "$DIR/.env"
            chmod 600 "$DIR/.env"
            if grep -q '^HINATA_ICS_SECRET=' "$DIR/.env"; then
              sed -i "s|^HINATA_ICS_SECRET=.*|HINATA_ICS_SECRET=$VALUE|" "$DIR/.env"
            else
              printf 'HINATA_ICS_SECRET=%s\n' "$VALUE" >> "$DIR/.env"
            fi

            if ! grep -q 'HINATA_ICS_SECRET' "$DIR/docker-compose.yml"; then
              # Under the server service's environment:, at its indentation.
              python3 - "$DIR/docker-compose.yml" <<'PY'
import re, sys
path = sys.argv[1]
text = open(path).read()
service = re.search(r'^([ \t]+)hinata-server:[ \t]*$', text, re.M)
if not service:
    sys.exit("hinata-server service not found")
indent = service.group(1)
env = re.compile(rf'^{re.escape(indent)}  environment:[ \t]*$', re.M)
hit = env.search(text, service.end())
if not hit:
    sys.exit("hinata-server has no environment: block")
line = f'\n{indent}    HINATA_ICS_SECRET: ${{HINATA_ICS_SECRET:-}}'
text = text[:hit.end()] + line + text[hit.end():]
open(path, 'w').write(text)
print("passthrough added to compose")
PY
            else
              echo "passthrough already in compose"
            fi

            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$DIR:/work" -w /work docker:cli \
              docker compose -p "$STACK" up -d --no-deps --force-recreate hinata-server

            if docker inspect "$STACK-hinata-server-1" \
                 --format '{{range .Config.Env}}{{println .}}{{end}}' \
                 | grep -q '^HINATA_ICS_SECRET=..*'; then
              echo "set and running"
            else
              echo "::error::$STACK still has no HINATA_ICS_SECRET after recreate"
              exit 1
            fi
            echo "::endgroup::"
          done
