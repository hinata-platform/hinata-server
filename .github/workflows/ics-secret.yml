# Puts HINATA_ICS_SECRET into the two production stacks on ASTASRV01.
#
# The box takes no SSH (port 22 answers nothing), and its Portainer stack records
# are stale — a redeploy through them would spawn duplicates on the NAS. What is
# left, and what the ordinary deploy already uses, is the self-hosted runner that
# lives on the box. Note that the runner is itself a container and cannot see
# /opt/stacks: a bind mount is resolved by the HOST daemon, so everything that
# touches the stack directory asks for it to be mounted into a fresh container
# and works in there. The docker CLI itself does work from the runner, so
# container-level questions are asked directly.
#
# Manual only, and never on a fork: the runner reaches the host's docker.
#
# One thing this file must never contain: a dollar followed by two braces is an
# Actions expression ANYWHERE in it, comments and shell blocks included, and an
# invalid one stops the whole workflow from parsing — which GitHub reports as a
# run with no jobs and a dispatch answering 422, not as a syntax error.
name: ICS secret

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = report structure only; apply = write the secret and recreate the server"
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]

jobs:
  ics-secret:
    name: Set HINATA_ICS_SECRET on asta + bear
    runs-on: [self-hosted, astasrv01]
    steps:
      - name: Inspect, and apply when asked
        env:
          MODE: ${{ inputs.mode }}
          SECRET_HINATA: ${{ secrets.HINATA_ICS_SECRET_ASTA }}
          SECRET_HINATA_BEAR: ${{ secrets.HINATA_ICS_SECRET_BEAR }}
        run: |
          set -euo pipefail

          # Runs a short script inside the stack's own directory.
          in_stack() {
            docker run --rm -e VALUE -v "/opt/stacks/$1:/work" -w /work docker:cli sh -euc "$2"
          }

          live() {
            docker inspect "$1-hinata-server-1" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
              | grep -qE '^HINATA_ICS_SECRET=.+'
          }

          # This repository is public, so its logs are. Nothing below ever
          # prints a file, a line of one, or a value — only whether it is there.
          for STACK in hinata hinata-bear; do
            echo "::group::inspect $STACK"
            in_stack "$STACK" '
              test -f docker-compose.yml || { echo "::error::no compose file"; exit 1; }
              echo "compose file:             present"
              test -f .env && echo ".env file:                present" || echo ".env file:                absent"
              echo "hinata-server service:    $(grep -cE "^[[:space:]]+hinata-server:[[:space:]]*$" docker-compose.yml || true)"
              echo "environment: blocks:      $(grep -cE "^[[:space:]]+environment:[[:space:]]*$" docker-compose.yml || true)"
              echo "env_file: directives:     $(grep -cE "^[[:space:]]+env_file:" docker-compose.yml || true)"
              echo "secret named in compose:  $(grep -c HINATA_ICS_SECRET docker-compose.yml || true)"
              echo "secret set in .env:       $(test -f .env && (grep -cE "^HINATA_ICS_SECRET=.+" .env || true) || echo n/a)"
            '
            echo "secret live in container: $(live "$STACK" && echo yes || echo no)"
            echo "::endgroup::"
          done

          if [ "$MODE" != "apply" ]; then
            echo "inspect only — nothing written"
            exit 0
          fi

          for STACK in hinata hinata-bear; do
            case "$STACK" in
              hinata) VALUE="$SECRET_HINATA" ;;
              hinata-bear) VALUE="$SECRET_HINATA_BEAR" ;;
              *) echo "::error::no secret mapped for $STACK"; exit 1 ;;
            esac
            test -n "$VALUE" || { echo "::error::no secret configured for $STACK"; exit 1; }
            export VALUE

            echo "::group::apply $STACK"

            # Idempotent. Rotating the value makes every stored calendar
            # subscription unreadable, so it is a decision somebody takes on
            # purpose, never the side effect of running this twice.
            if live "$STACK"; then
              echo "already set — left untouched"
              echo "::endgroup::"
              continue
            fi

            # Only the .env is written. The compose file is left exactly as it
            # is: editing YAML through three layers of quoting is how a
            # production stack gets broken, so a missing passthrough stops this
            # and says so rather than guessing at the file.
            in_stack "$STACK" '
              grep -q HINATA_ICS_SECRET docker-compose.yml || {
                echo "::error::compose does not pass HINATA_ICS_SECRET to the server"
                exit 1
              }
              STAMP=$(date -u +%Y%m%dT%H%M%SZ)
              if [ -f .env ]; then
                cp -a .env ".env.bak-$STAMP"
                echo "backed up .env as .env.bak-$STAMP"
              else
                echo "no .env to back up"
              fi
              touch .env
              chmod 600 .env
              grep -v "^HINATA_ICS_SECRET=" .env > .env.tmp || true
              mv .env.tmp .env
              chmod 600 .env
              printf "HINATA_ICS_SECRET=%s\n" "$VALUE" >> .env
              echo "written to .env"
            '

            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "/opt/stacks/$STACK:/work" -w /work docker:cli \
              docker compose -p "$STACK" up -d --no-deps --force-recreate hinata-server

            if live "$STACK"; then
              echo "set and running"
            else
              echo "::error::$STACK still has no HINATA_ICS_SECRET after the recreate"
              exit 1
            fi
            echo "::endgroup::"
          done
