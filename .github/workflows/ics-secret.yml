# Puts HINATA_ICS_SECRET into the two production stacks on ASTASRV01.
#
# The box takes no SSH (port 22 answers nothing), and its Portainer stack records
# are stale — a redeploy through them would spawn duplicates on the NAS. What is
# left, and what the ordinary deploy already uses, is the self-hosted runner that
# lives on the box with the host docker socket. So this runs there.
#
# Manual only, and never on a fork: the runner holds that socket.
#
# Two things this file must never contain, both learned the hard way. A dollar
# followed by two braces is an Actions expression ANYWHERE in the file, comments
# and shell blocks included — an invalid one makes the whole workflow fail to
# parse, which surfaces as a run with no jobs and a dispatch that answers 422.
# And a heredoc body written at column zero ends the YAML block scalar. Hence
# awk, single quotes, and no heredoc.
name: ICS secret

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = report structure only; apply = write the secret and recreate the server"
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]

jobs:
  ics-secret:
    name: Set HINATA_ICS_SECRET on asta + bear
    runs-on: [self-hosted, astasrv01]
    steps:
      - name: Inspect, and apply when asked
        env:
          MODE: ${{ inputs.mode }}
          SECRET_HINATA: ${{ secrets.HINATA_ICS_SECRET_ASTA }}
          SECRET_HINATA_BEAR: ${{ secrets.HINATA_ICS_SECRET_BEAR }}
        run: |
          set -euo pipefail

          # This repository is public, so its logs are. Nothing below ever prints
          # a file, a line of one, or a value — only whether things are there.
          set_in_container() {
            docker inspect "$1-hinata-server-1" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
              | grep -qE '^HINATA_ICS_SECRET=.+'
          }

          for STACK in hinata hinata-bear; do
            DIR="/opt/stacks/$STACK"
            echo "::group::inspect $STACK"
            test -d "$DIR" || { echo "::error::$DIR does not exist"; exit 1; }
            test -f "$DIR/docker-compose.yml" || { echo "::error::no compose file"; exit 1; }

            echo "compose file:              present"
            echo ".env file:                 $(test -f "$DIR/.env" && echo present || echo absent)"
            echo "hinata-server service:     $(grep -cE '^[[:space:]]+hinata-server:[[:space:]]*$' "$DIR/docker-compose.yml" || true)"
            echo "environment: blocks:       $(grep -cE '^[[:space:]]+environment:[[:space:]]*$' "$DIR/docker-compose.yml" || true)"
            echo "env_file: directives:      $(grep -cE '^[[:space:]]+env_file:' "$DIR/docker-compose.yml" || true)"
            echo "secret named in compose:   $(grep -c 'HINATA_ICS_SECRET' "$DIR/docker-compose.yml" || true)"
            echo "secret set in .env:        $(test -f "$DIR/.env" && (grep -cE '^HINATA_ICS_SECRET=.+' "$DIR/.env" || true) || echo 'n/a')"
            echo "secret live in container:  $(set_in_container "$STACK" && echo yes || echo no)"
            echo "::endgroup::"
          done

          if [ "$MODE" != "apply" ]; then
            echo "inspect only — nothing written"
            exit 0
          fi

          for STACK in hinata hinata-bear; do
            DIR="/opt/stacks/$STACK"
            COMPOSE="$DIR/docker-compose.yml"
            case "$STACK" in
              hinata) VALUE="$SECRET_HINATA" ;;
              hinata-bear) VALUE="$SECRET_HINATA_BEAR" ;;
              *) echo "::error::no secret mapped for $STACK"; exit 1 ;;
            esac
            test -n "$VALUE" || { echo "::error::no secret configured for $STACK"; exit 1; }

            echo "::group::apply $STACK"

            # Idempotent. Rotating the value makes every stored calendar
            # subscription unreadable, so it is a decision somebody takes on
            # purpose, never the side effect of running this twice.
            if set_in_container "$STACK"; then
              echo "already set — left untouched"
              echo "::endgroup::"
              continue
            fi

            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            cp -a "$COMPOSE" "$COMPOSE.bak-$STAMP"
            if [ -f "$DIR/.env" ]; then cp -a "$DIR/.env" "$DIR/.env.bak-$STAMP"; fi
            echo "backed up as *.bak-$STAMP"

            # The value goes in the stack's .env, which compose reads for
            # interpolation, so it stays out of the file people open and paste
            # from. Single quotes below: what compose wants is a dollar and one
            # brace, and writing two would make it an Actions expression.
            touch "$DIR/.env"
            chmod 600 "$DIR/.env"
            if grep -qE '^HINATA_ICS_SECRET=' "$DIR/.env"; then
              grep -v '^HINATA_ICS_SECRET=' "$DIR/.env" > "$DIR/.env.tmp"
              mv "$DIR/.env.tmp" "$DIR/.env"
              chmod 600 "$DIR/.env"
            fi
            printf 'HINATA_ICS_SECRET=%s\n' "$VALUE" >> "$DIR/.env"

            if grep -q 'HINATA_ICS_SECRET' "$COMPOSE"; then
              echo "passthrough already in compose"
            else
              PASS='HINATA_ICS_SECRET: ${HINATA_ICS_SECRET:-}'
              awk -v pass="$PASS" '
                BEGIN { svc = 0; added = 0; pad = 0 }
                /^[[:space:]]+hinata-server:[[:space:]]*$/ {
                  svc = 1
                  pad = match($0, /[^ ]/) - 1
                }
                svc == 1 && added == 0 && /^[[:space:]]+environment:[[:space:]]*$/ {
                  print
                  printf "%*s%s\n", pad + 4, "", pass
                  added = 1
                  next
                }
                { print }
                END { if (added == 0) exit 3 }
              ' "$COMPOSE" > "$COMPOSE.new"
              mv "$COMPOSE.new" "$COMPOSE"
              echo "passthrough added under the server's environment"
            fi

            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$DIR:/work" -w /work docker:cli \
              docker compose -p "$STACK" up -d --no-deps --force-recreate hinata-server

            if set_in_container "$STACK"; then
              echo "set and running"
            else
              echo "::error::$STACK still has no HINATA_ICS_SECRET after the recreate"
              exit 1
            fi
            echo "::endgroup::"
          done
