# Local development infrastructure only (run the server from your IDE):
#   ./deploy/x509/setup-dev.sh          # generates certs + starts mongo + X.509 user
#   SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun
#
# MongoDB runs standalone with requireTLS + --auth and accepts only X.509
# clients (gold standard: TLS encryption + X.509 authentication). SeaweedFS/Mailpit
# keep dev defaults. Images are pinned by digest-friendly minor tags (not :latest).
name: hinata-dev

services:
  mongo:
    image: mongo:8.2.12
    # requireTLS + client-cert verification (tlsCAFile). --auth turns on access
    # control; the X.509 user is created by deploy/x509/setup-dev.sh.
    command: >-
      mongod --bind_ip_all --auth
      --tlsMode requireTLS
      --tlsCertificateKeyFile /etc/mongo/certs/server.pem
      --tlsCAFile /etc/mongo/certs/ca.crt
    ports:
      - "127.0.0.1:27017:27017"   # loopback only — never expose dev Mongo on 0.0.0.0
    volumes:
      - mongo-dev-data:/data/db
      - ./deploy/x509/dev:/etc/mongo/certs:ro
    healthcheck:
      test: >-
        mongosh --quiet --tls --tlsCAFile /etc/mongo/certs/ca.crt
        --tlsCertificateKeyFile /etc/mongo/certs/hinata-app.pem
        --host localhost --eval "db.runCommand({ping:1}).ok" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI: http://localhost:8025

  # SeaweedFS as in production (deploy/seaweedfs), with dev-only secrets. Start the server with
  # HINATA_S3_ENDPOINT=http://localhost:8333, HINATA_S3_ACCESS_KEY=hinata,
  # HINATA_S3_SECRET_KEY=hinata-dev-secret-0123456789abcdef, HINATA_S3_ADDRESSING_STYLE=path
  # and HINATA_S3_SSE=AES256.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: [local-storage]
    entrypoint: ["/bin/sh", "/opt/hinata/entrypoint.sh"]
    environment: &seaweedfs-env
      HINATA_S3_BUCKET: hinata
      HINATA_S3_ACCESS_KEY: hinata
      HINATA_S3_SECRET_KEY: hinata-dev-secret-0123456789abcdef
      SEAWEEDFS_ADMIN_ACCESS_KEY: hinata-admin
      SEAWEEDFS_ADMIN_SECRET_KEY: hinata-dev-admin-0123456789abcdef
      WEED_S3_SSE_KEK: 6c0b5d2a9f3e4b1c8d7a6e5f40312b1c9d8e7f6a5b4c3d2e1f00112233445566
      WEED_JWT_SIGNING_KEY: dev-jwt-volume-write-0123456789abcdef
      WEED_JWT_SIGNING_READ_KEY: dev-jwt-volume-read-0123456789abcdef
      WEED_JWT_FILER_SIGNING_KEY: dev-jwt-filer-write-0123456789abcdef
      WEED_JWT_FILER_SIGNING_READ_KEY: dev-jwt-filer-read-0123456789abcdef
    ports:
      - "127.0.0.1:8333:8333" # S3 API only
    volumes:
      - seaweedfs-dev-data:/data
      - ./deploy/seaweedfs:/opt/hinata:ro

  seaweedfs-setup:
    image: amazon/aws-cli:2.31.13
    profiles: [local-storage]
    entrypoint: ["/bin/sh", "/opt/hinata/setup.sh"]
    depends_on: [seaweedfs]
    environment:
      <<: *seaweedfs-env
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./deploy/seaweedfs:/opt/hinata:ro

volumes:
  mongo-dev-data:
  seaweedfs-dev-data:
